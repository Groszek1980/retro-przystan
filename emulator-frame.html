<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Odtwarzacz Commodore 64</title>
  <style>
    html, body { width:100%; height:100%; padding:0; margin:0; overflow:hidden; background:#080916; }
    #viewport { position:fixed; inset:0; overflow:hidden; }
    #game { width:100%; height:100%; overflow:hidden; }
    #error { box-sizing:border-box; display:none; position:fixed; inset:0; padding:24px;
             background:#11152b; color:#fff; font:15px/1.6 Arial,sans-serif; }
  </style>
</head>
<body>
  <div id="viewport"><div id="game"></div></div>
  <div id="error" role="alert"></div>
  <script>
    'use strict';
    var started = false;
    function reportError(message) {
      document.getElementById('error').textContent = message;
      document.getElementById('error').style.display = 'block';
      parent.postMessage({ type:'retro-c64-error', message:message }, location.origin);
    }
    window.addEventListener('message', function(event) {
      if (event.origin !== location.origin || event.source !== parent) return;
      var data = event.data || {};
      if (data.type !== 'retro-c64-start' || started) return;
      if ((!data.file && !data.url) || !data.name) { reportError('Nieprawidłowe dane gry.'); return; }
      started = true;
      window.EJS_player = '#game';
      window.EJS_core = data.legacy ? 'vice_x64' : 'vice_x64sc';
      // Zamiast blob URL przekazujemy bezpośrednio obiekt File z zachowanym rozszerzeniem.
      window.EJS_gameUrl = data.file || data.url;
      window.EJS_gameName = data.name;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      // Jedyna zmiana sterowania: jawne przypisania RetroPad dla gracza 1.
      // B = Fire, kierunki = DPAD, V = klawiatura ekranowa.
      // Nie ingerujemy w opcje rdzenia VICE ani sposob wczytywania plikow.
      window.EJS_defaultControls = {
        0: {
          0: { value:'x', value2:'BUTTON_2' },
          2: { value:'v', value2:'SELECT' },
          3: { value:'enter', value2:'START' },
          4: { value:'up arrow', value2:'DPAD_UP' },
          5: { value:'down arrow', value2:'DPAD_DOWN' },
          6: { value:'left arrow', value2:'DPAD_LEFT' },
          7: { value:'right arrow', value2:'DPAD_RIGHT' }
        }
      };
      if (data.legacy) window.EJS_forceLegacyCores = true;
      var loader = document.createElement('script');
      loader.src = window.EJS_pathtodata + 'loader.js';
      loader.onerror = function() {
        reportError('Nie można pobrać EmulatorJS. Sprawdź połączenie internetowe i blokowanie skryptów.');
      };
      document.body.appendChild(loader);
      parent.postMessage({ type:'retro-c64-loading', name:data.name }, location.origin);
    });
    // Pasywna diagnostyka: przechwytujemy tylko informację o naciśnięciu.
    // Nie blokujemy zdarzenia ani nie modyfikujemy mapowania sterowania.
    window.addEventListener('keydown', function(event) {
      if (!started || event.repeat) return;
      var code = event.code || '';
      var key = event.key || '';
      if (code === 'ArrowUp' || code === 'ArrowDown' ||
          code === 'ArrowLeft' || code === 'ArrowRight' ||
          code === 'KeyX' || code === 'Space' ||
          code === 'Enter' || code === 'ControlRight' ||
          key === 'x' || key === 'X') {
        parent.postMessage({
          type:'retro-c64-key-detected', code:code, key:key
        }, location.origin);
      }
    }, true);
    parent.postMessage({ type:'retro-c64-ready' }, location.origin);
  </script>
</body>
</html>
