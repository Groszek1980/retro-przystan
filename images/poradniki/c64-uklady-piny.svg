<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 510" role="img" aria-labelledby="t d">
<title id="t">Punkty pomiarowe na układach U5, U19 i U7 starszych płyt C64</title>
<desc id="d">Schemat pinów DIP z góry, z wycięciem orientacyjnym. U5 pamięć znaków, pin 24 plus 5 V. U19 VIC-II, pin 40 plus 5 V CAN i pin 13 plus 12 V. U7 procesor 6510, pin 40 RESET około 5 V po uruchomieniu. Dotyczy tylko starszych długich płyt; nie stosować do 250469.</desc>
<rect width="1050" height="510" rx="18" fill="#151a32"/>
<text x="34" y="49" fill="#f5f0ff" font-family="sans-serif" font-size="25" font-weight="700">PUNKTY NA UKŁADACH DIP — TYLKO DŁUGIE PŁYTY</text>
<text x="34" y="79" fill="#c7bedf" font-family="sans-serif" font-size="15">WIDOK Z GÓRY • wycięcie układu u góry • NIE jest to rozmieszczenie elementów na płycie</text>
<g font-family="sans-serif">
<rect x="55" y="125" width="265" height="272" rx="12" fill="#26294b" stroke="#696183" stroke-width="2"/>
<text x="187" y="154" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">U5 — ROM</text>
<rect x="113" y="184" width="135" height="173" rx="6" fill="#0e1427" stroke="#8b85a8" stroke-width="2"/>
<path d="M167 184 Q179 201 194 184" stroke="#69708e" stroke-width="5" fill="none"/>
<text x="128" y="210" font-size="16" fill="#b2aed7">1</text><text x="218" y="210" font-size="16" fill="#71f2df">24</text>
<circle cx="237" cy="198" r="13" fill="none" stroke="#71f2df" stroke-width="3"/>
<text x="128" y="344" font-size="16" fill="#b2aed7">12</text><text x="218" y="344" font-size="16" fill="#b2aed7">13</text>
<text x="187" y="382" text-anchor="middle" font-size="15" fill="#71f2df">24 = +5 V DC</text>
<rect x="392" y="125" width="265" height="272" rx="12" fill="#26294b" stroke="#696183" stroke-width="2"/>
<text x="524" y="154" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">U19 — VIC-II</text>
<rect x="450" y="184" width="135" height="173" rx="6" fill="#0e1427" stroke="#8b85a8" stroke-width="2"/>
<path d="M505 184 Q516 201 531 184" stroke="#69708e" stroke-width="5" fill="none"/>
<text x="467" y="210" font-size="16" fill="#b2aed7">1</text><text x="556" y="210" font-size="16" fill="#71f2df">40</text>
<circle cx="575" cy="198" r="13" fill="none" stroke="#71f2df" stroke-width="3"/>
<text x="467" y="295" font-size="16" fill="#f4b6e4">13</text><circle cx="463" cy="278" r="14" fill="none" stroke="#f4b6e4" stroke-width="3"/>
<text x="467" y="344" font-size="16" fill="#b2aed7">20</text><text x="556" y="344" font-size="16" fill="#b2aed7">21</text>
<text x="524" y="382" text-anchor="middle" font-size="15" fill="#71f2df">40 = +5 V CAN</text>
<text x="524" y="404" text-anchor="middle" font-size="15" fill="#f4b6e4">13 = +12 V DC</text>
<rect x="727" y="125" width="265" height="272" rx="12" fill="#26294b" stroke="#696183" stroke-width="2"/>
<text x="860" y="154" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">U7 — 6510</text>
<rect x="785" y="184" width="135" height="173" rx="6" fill="#0e1427" stroke="#8b85a8" stroke-width="2"/>
<path d="M840 184 Q852 201 867 184" stroke="#69708e" stroke-width="5" fill="none"/>
<text x="802" y="210" font-size="16" fill="#b2aed7">1</text><text x="891" y="210" font-size="16" fill="#e9d58b">40</text>
<circle cx="908" cy="198" r="13" fill="none" stroke="#e9d58b" stroke-width="3"/>
<text x="802" y="344" font-size="16" fill="#b2aed7">20</text><text x="891" y="344" font-size="16" fill="#b2aed7">21</text>
<text x="860" y="382" text-anchor="middle" font-size="15" fill="#e9d58b">40 = RESET (około 5 V)</text>
</g>
<text x="38" y="464" font-size="15" font-family="sans-serif" fill="#f1c7ae">Dla ASSY 250469 NIE używaj tych oznaczeń U7/U19 i nie oczekuj +12 V na VIC-II.</text>
<text x="38" y="490" font-size="13" font-family="sans-serif" fill="#bbb5d1">Numerację liczymy od znacznika pinu 1; przed pomiarem potwierdź wyprowadzenia według dokumentacji danego układu.</text>
</svg>